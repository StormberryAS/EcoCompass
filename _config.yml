# GitHub Pages serves eco.stormberry.as from this repository root.
#
# Without this file Jekyll publishes the WHOLE repository, so the tooling scripts, the
# README and the licence were all reachable from the live site. Nothing here was secret,
# these repos are public, but source and tooling have no business being served next to
# the product.
#
# Added 2026-09-05 in the estate-wide sweep that followed finding
# scheduler.stormberry.as/index.dev.html live, a second working rendering of that app.
#
# Jekyll's `exclude` REPLACES its defaults rather than adding to them, which is why
# node_modules/ and friends are listed where they apply.
#
# disclaimer.html and privacy.html are deliberately NOT excluded: they are the published
# pages the footer links to. Only the Markdown sources are withheld.
#
# DISCLAIMER.md is excluded (6 November 2026). It is the Markdown source of disclaimer.html.
# The first-run notice (gate.js) and the footer link disclaimer.html, and no served file
# links DISCLAIMER.md.
#
# TypeScript (5 November 2026): the app's code is written in ts/ and compiled by tools/build-ts.sh
# into app.js, which IS published (GitHub Pages has no build step, so the compiled file is
# committed), as are the vendored suncalc.js and the generated cities.js and gate.js. The sources
# (ts/, with the SunCalc and cities.js declarations), the compiler's settings (tsconfig.json), the
# build script and the tests (tools/, tests/), the package files and .npmrc, and node_modules/,
# where npm ci puts TypeScript, are excluded. (.npmrc and .gitattributes are dot files, which
# Jekyll never publishes; .npmrc is listed anyway, as in AstroQuiz and the others.) The old
# hand-written test.js, which the site served, is gone: its tests are in tests/.
exclude:
  - DISCLAIMER.md
  - LICENSE
  - README.md
  - bump_assets.py
  - tools/
  - tests/
  - package.json
  - package-lock.json
  - .npmrc
  - node_modules/
  - tsconfig.json
  - ts/
